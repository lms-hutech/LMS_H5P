name: UEF CI/CD

on:
  push:
    branches:
      - uef
      - UEF
  pull_request:
    branches:
      - uef
      - UEF

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: node:20
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Verify H5P library assets
        run: npm run verify:h5p-libraries

      - name: Build h5p-server first
        run: npm run build:h5p-server

      - name: Build all packages
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.DOCKER_USERNAME != '' && format('{0}/h5p-lti:latest', env.DOCKER_USERNAME) || 'h5p-lti:latest' }}
            ${{ env.DOCKER_USERNAME != '' && format('{0}/h5p-lti:uef-{1}', env.DOCKER_USERNAME, github.sha) || 'h5p-lti:uef-local' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name == 'push'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Deploy to server via SSH
        if: env.DOCKER_USERNAME != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/h5p
            cat > .env <<'EOF'
            H5P_IMAGE=${{ env.DOCKER_USERNAME }}/h5p-lti:latest
            H5P_PUBLIC_URL=${{ secrets.H5P_PUBLIC_URL }}
            PLATFORM_URL=${{ secrets.PLATFORM_URL }}
            LTI_CLIENT_ID=${{ secrets.LTI_CLIENT_ID }}
            LTI_KEY=${{ secrets.LTI_KEY }}
            CANVAS_ISSUER=${{ secrets.CANVAS_ISSUER }}
            CANVAS_API_TOKEN=${{ secrets.CANVAS_API_TOKEN }}
            NODE_ENV=production
            EOF
            docker compose -f docker-compose.lti.yml pull h5p
            docker compose -f docker-compose.lti.yml up -d --force-recreate h5p

  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name == 'push'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --entrypoint sh
        volumes:
          - /tmp/minio:/data

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify H5P library assets
        run: npm run verify:h5p-libraries

      - name: Build packages
        run: npm run build:h5p-server ; npm run build

      - name: Run integration tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://localhost:27017/h5p-test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
